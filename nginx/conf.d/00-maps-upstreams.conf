map "$request_method:$request_uri" $cache_control_header {
  default "no-store";
  ~^GET:/api(?:/|$) "no-store";
  ~^HEAD:/api(?:/|$) "no-store";
  ~^GET:/mirror/api(?:/|$) "no-store";
  ~^HEAD:/mirror/api(?:/|$) "no-store";
  ~^GET: "public, max-age=3600";
  ~^HEAD: "public, max-age=3600";
}

map $request_method $api_group {
  GET backend_api_read;
  HEAD backend_api_read;
  OPTIONS backend_api_read;
  default backend_api_write;
}

map $request_method $mirror_api_group {
  GET backend_mirror_read;
  HEAD backend_mirror_read;
  OPTIONS backend_mirror_read;
  default backend_mirror_write;
}

upstream admin_ui {
  server adminer:8080;
}

upstream grafana_ui {
  server grafana:3000;
}