server {
  listen 80;
  server_name _;

  root /var/www/static;
  index index.html;

  add_header Server "ChessInsight" always;
  add_header Cache-Control $cache_control_header always;

  location = /documentation {
    try_files /documentation/index.html =404;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /documentation/ {
    try_files $uri $uri/ =404;
  }

  location /assets/readme/ {
    alias /var/www/static/img/;
  }

  location /reserved/ {
    try_files /index.html =404;
  }

  location /management/ {
    try_files /management/index.html =404;
  }

  location /admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_pass http://admin_ui/;
  }

  location = /api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    add_header Server "ChessInsight" always;
    add_header Cache-Control $cache_control_header always;
    add_header X-Upstream-Addr $upstream_addr always;
    add_header X-Upstream-Group $api_group always;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    rewrite ^ /api/v1/swagger-ui.html break;
    proxy_pass http://backend_api_read;
  }

  location /api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    add_header Server "ChessInsight" always;
    add_header Cache-Control $cache_control_header always;
    add_header X-Upstream-Addr $upstream_addr always;
    add_header X-Upstream-Group $api_group always;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_pass http://backend_api_read;
    limit_except GET HEAD OPTIONS {
      proxy_pass http://backend_api_write;
    }
  }

  location = /mirror/api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mirror;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Server;
    add_header Server "ChessInsight" always;
    add_header Cache-Control $cache_control_header always;
    add_header X-Upstream-Addr $upstream_addr always;
    add_header X-Upstream-Group $mirror_api_group always;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    sub_filter_types text/html application/javascript text/css;
    sub_filter_once off;
    sub_filter '/api/v1/' '/mirror/api/v1/';
    proxy_redirect ~^(/api/v1/.*)$ /mirror$1;
    rewrite ^ /api/v1/swagger-ui.html break;
    proxy_pass http://backend_mirror_read;
  }

  location /mirror/api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mirror;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Server;
    add_header Server "ChessInsight" always;
    add_header Cache-Control $cache_control_header always;
    add_header X-Upstream-Addr $upstream_addr always;
    add_header X-Upstream-Group $mirror_api_group always;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    sub_filter_types text/html application/javascript text/css;
    sub_filter_once off;
    sub_filter '/api/v1/' '/mirror/api/v1/';
    proxy_redirect ~^(/api/v1/.*)$ /mirror$1;
    rewrite ^/mirror(/api/v1/.*)$ $1 break;
    proxy_pass http://backend_mirror_read;
    limit_except GET HEAD OPTIONS {
      proxy_pass http://backend_mirror_write;
    }
  }

  location = /monitoring {
    return 301 /monitoring/;
  }

  location /monitoring/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /monitoring;
    proxy_hide_header Server;
    proxy_redirect off;
    proxy_pass http://grafana_ui;
  }

  location = /status/raw {
    stub_status on;
    access_log off;
    allow all;
  }

  location = /status {
    try_files /status/index.html =404;
  }

  location /mirror/ {
    alias /var/www/static/;
    gzip off;
    index index.html;
    sub_filter_types text/html application/javascript text/css;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/mirror/';
    sub_filter 'src="/' 'src="/mirror/';
    sub_filter 'action="/' 'action="/mirror/';
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
