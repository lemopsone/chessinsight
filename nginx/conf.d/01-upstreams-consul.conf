upstream backend_api_read {
  server backend:8080 max_fails=3 fail_timeout=10s weight=2;
  server backend_ro1:8081 max_fails=3 fail_timeout=10s;
  server backend_ro2:8082 max_fails=3 fail_timeout=10s;
}

upstream backend_api_write {
  server backend:8080 max_fails=3 fail_timeout=10s;
}

upstream backend_mirror_read {
  server backend_mirror:8083 max_fails=3 fail_timeout=10s weight=2;
  server backend_mirror_ro1:8084 max_fails=3 fail_timeout=10s;
  server backend_mirror_ro2:8085 max_fails=3 fail_timeout=10s;
}

upstream backend_mirror_write {
  server backend_mirror:8083 max_fails=3 fail_timeout=10s;
}
