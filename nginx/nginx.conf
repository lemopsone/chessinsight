worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { text/markdown md; }
  sendfile on;
  keepalive_timeout 65;

  upstream backend_api {
    server backend:8080;
  }

  upstream admin_ui {
    server adminer:8080;
  }

  server {
    listen 80;
    server_name _;

    root /var/www/static;
    index index.html;

    location = /documentation {
      try_files /documentation/index.html =404;
    }

    location /documentation/ {
      try_files $uri $uri/ =404;
    }

    location /assets/readme/ {
      alias /var/www/static/img/;
    }

    location /reserved/ {
      try_files /index.html =404;
    }

    location /management/ {
      try_files /management/index.html =404;
    }

    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://admin_ui/;
    }

    location = /api/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend_api/api/v1/swagger-ui.html;
    }

    location /api/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend_api/api/v1/;
    }

    location = /status/raw {
      stub_status on;
      access_log off;
      allow all;
    }

    location = /status {
      try_files /status/index.html =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
