spring:
  application:
    name: chessinsight-api
  main:
    banner-mode: off

  datasource:
    url: ${PG_URL:jdbc:postgresql://postgres:5432/chess_insight}
    username: ${PG_USER:admin}
    password: ${PG_PASS:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  data:
    redis:
      host: redis
      port: 6379
      connect-timeout: 10s

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}

engine:
  stockfish:
    mode: tcp
    host: stockfish
    port: 5555
    path: /usr/local/bin/stockfish
    defaultDepth: 15
    poolSize: 32
    eagerWarmup: true
    readTimeoutMs: 5000

analysis:
  move:
    http:
      max-concurrent-requests: 48
      acquire-timeout-ms: 500

server:
  port: 8080
  servlet:
    context-path: /api
jwt:
  secret: ${JWT_SECRET_KEY:asdkoasfiuwerjfniwef_32124Q_e}
  expiration: 3600

security:
  auth:
    user-cache-ttl-seconds: 60
    mail:
      enabled: ${SECURITY_AUTH_MAIL_ENABLED:false}
      from: ${SECURITY_AUTH_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@chessinsight.local}}

logging:
  level:
    root: info
    ru.chessinsight: info

springdoc:
  api-docs:
    enabled: true
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    url: /v1/openapi.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests:
          - 50ms
          - 100ms
          - 200ms
          - 500ms
          - 1s
          - 2s
          - 5s
          - 10s
