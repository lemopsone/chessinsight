services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=2
      - ENGINE_STOCKFISH_HASH=128
      - ENGINE_STOCKFISH_PONDER=false
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-backend}
      - MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=${MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED:-false}
      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_RU_CHESSINSIGHT=${LOG_LEVEL_CHESSINSIGHT:-INFO}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=${LOG_LEVEL_SPRING_WEB:-INFO}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=${LOG_LEVEL_SPRING_SECURITY:-INFO}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_FILTER=${LOG_LEVEL_SPRING_WEBFILTER:-INFO}
      - LOGGING_LEVEL_IO_MICROMETER_TRACING=${LOG_LEVEL_MICROMETER_TRACING:-INFO}
      - LOGGING_LEVEL_IO_OPENTELEMETRY_EXPORTER=${LOG_LEVEL_OPENTELEMETRY_EXPORTER:-INFO}
      - PG_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_USER}
      - PG_PASS=${DB_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8080
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-master
      - redis
      - otel-collector
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    networks:
      - chessnet

  backend_ro1:
    profiles: ["replica"]
    container_name: backend-ro-1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=1
      - ENGINE_STOCKFISH_HASH=64
      - ENGINE_STOCKFISH_PONDER=false
      - PG_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_READONLY_USER}
      - PG_PASS=${DB_READONLY_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8081
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-master
      - redis
    networks:
      - chessnet

  backend_ro2:
    profiles: ["replica"]
    container_name: backend-ro-2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=1
      - ENGINE_STOCKFISH_HASH=64
      - ENGINE_STOCKFISH_PONDER=false
      - PG_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_READONLY_USER}
      - PG_PASS=${DB_READONLY_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8082
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-master
      - redis
    networks:
      - chessnet

  backend_mirror:
    profiles: ["replica"]
    container_name: backend-mirror
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=2
      - ENGINE_STOCKFISH_HASH=128
      - ENGINE_STOCKFISH_PONDER=false
      - PG_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_USER}
      - PG_PASS=${DB_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8083
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-master
      - redis
    networks:
      - chessnet

  backend_mirror_ro1:
    profiles: ["replica"]
    container_name: backend-mirror-ro-1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=1
      - ENGINE_STOCKFISH_HASH=64
      - ENGINE_STOCKFISH_PONDER=false
      - PG_URL=jdbc:postgresql://${DB_REPLICA_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_READONLY_USER}
      - PG_PASS=${DB_READONLY_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8084
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-replica
      - redis
    networks:
      - chessnet

  backend_mirror_ro2:
    profiles: ["replica"]
    container_name: backend-mirror-ro-2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - ENGINE_STOCKFISH_HOST=${ENGINE_STOCKFISH_HOST:-stockfish-pool}
      - ENGINE_STOCKFISH_PORT=${ENGINE_STOCKFISH_PORT:-5555}
      - ENGINE_STOCKFISH_THREADS=1
      - ENGINE_STOCKFISH_HASH=64
      - ENGINE_STOCKFISH_PONDER=false
      - PG_URL=jdbc:postgresql://${DB_REPLICA_HOST}:${DB_PORT}/${DB_NAME}
      - PG_USER=${DB_READONLY_USER}
      - PG_PASS=${DB_READONLY_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
      - SERVER_PORT=8085
      - SECURITY_AUTH_REQUIRE_EMAIL_OTP=${SECURITY_AUTH_REQUIRE_EMAIL_OTP:-true}
      - SECURITY_AUTH_MAIL_ENABLED=${SECURITY_AUTH_MAIL_ENABLED:-true}
      - SECURITY_AUTH_MAIL_FROM=${SECURITY_AUTH_MAIL_FROM:-no-reply@chessinsight.local}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      - postgres-replica
      - redis
    networks:
      - chessnet

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./monitoring/consul/nginx-upstreams.ctmpl:/etc/nginx/conf.d/01-upstreams-consul.conf.ctmpl:ro
      - ./monitoring/consul/consul-template.hcl:/etc/consul-template/consul-template.hcl:ro
    depends_on:
      - backend
      - adminer
      - grafana
      - consul
    networks:
      - chessnet

  consul:
    image: hashicorp/consul:1.17.2
    container_name: consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
    ports:
      - "8500:8500"
    volumes:
      - consul-data:/consul/data
      - ./monitoring/consul/services:/consul/config
    networks:
      - chessnet



  adminer:
    image: adminer:4
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres-master
    depends_on:
      - postgres-master
    networks:
      - chessnet

  stockfish-1:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-1
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1g
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-2:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-2
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-3:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-3
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-mock:
    profiles: ["mock"]
    build:
      context: ./test-fixtures/stockfish-mock
      dockerfile: Dockerfile
    container_name: stockfish-mock
    expose:
      - "5555"
    networks:
      - chessnet

  stockfish-pool:
    build:
      context: .
      dockerfile: Dockerfile
      target: stockfish-pool
    container_name: stockfish-pool
    volumes:
      - ./nginx/generated/streams:/etc/nginx/streams-enabled
      - ./monitoring/consul/stockfish-stream.ctmpl:/etc/nginx/stockfish-stream.conf.ctmpl:ro
      - ./monitoring/consul/consul-template-stockfish.hcl:/etc/consul-template/consul-template.hcl:ro
    depends_on:
      - stockfish-1
      - stockfish-2
      - stockfish-3
      - consul
    networks:
      - chessnet

  postgres-master:
    image: postgres:15
    container_name: postgres-master
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      READONLY_USER: ${DB_READONLY_USER}
      READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    networks:
      - chessnet

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    entrypoint: ["/usr/local/bin/docker-entrypoint-replica.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
      REPLICATION_HOST: postgres-master
      REPLICATION_PORT: 5432
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/docker-entrypoint-replica.sh:/usr/local/bin/docker-entrypoint-replica.sh:ro
    depends_on:
      - postgres-master
    ports:
      - "5433:5432"
    networks:
      - chessnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chessnet

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
    networks:
      - chessnet

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /jaeger
    ports:
      - "16686:16686"
    networks:
      - chessnet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: otel-collector
    user: "0:0"
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      - ./reports/perf/otel:/var/lib/otel
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    networks:
      - chessnet

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - chessnet

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - chessnet

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - chessnet

  cadvisor:
    profiles: ["linux"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - chessnet

  cadvisor-desktop:
    profiles: ["macos"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor-desktop
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    networks:
      - chessnet

  node-exporter:
    profiles: ["linux"]
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - chessnet

volumes:
  postgres-master-data:
  postgres-replica-data:
  grafana-data:
  prometheus-data:
  loki-data:
  es-data:
  consul-data:

networks:
  chessnet:
    driver: bridge
