version: "3.8"

services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
#    volumes:
#      - ./:/app
#    working_dir: /app
    environment:
      - ENGINE_HOST=stockfish
      - ENGINE_PORT=5555
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
    depends_on:
      - postgres
#      - elasticsearch
      - redis
      - stockfish
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    networks:
      - chessnet

  stockfish:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1g
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - chessnet

#  elasticsearch:
#    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
#    environment:
#      - discovery.type=single-node
#      - xpack.security.enabled=false
#      - ES_JAVA_OPTS=-Xms512m -Xmx512m
#    ports:
#      - "${ES_PORT}:9200"
#    volumes:
#      - es-data:/usr/share/elasticsearch/data
#    networks:
#      - chessnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chessnet

volumes:
  postgres-data:
  es-data:

networks:
  chessnet:
    driver: bridge
