services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
#    volumes:
#      - ./:/app
#    working_dir: /app
    environment:
      - ENGINE_HOST=stockfish
      - ENGINE_PORT=5555
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ENGINE_STOCKFISH_HOST=stockfish-pool
      - ENGINE_STOCKFISH_PORT=5555
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
    depends_on:
      - postgres
#      - elasticsearch
      - redis
      - stockfish-pool
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    networks:
      - chessnet

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - adminer
    networks:
      - chessnet

  adminer:
    image: adminer:4
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - chessnet

  stockfish-1:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-1
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1g
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-2:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-2
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-3:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish-3
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData

  stockfish-pool:
    build:
      context: .
      dockerfile: Dockerfile
      target: stockfish-pool
    container_name: stockfish-pool
    volumes:
      - ./nginx/stockfish-stream.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/consul/stockfish-stream.ctmpl:/etc/nginx/stockfish-stream.conf.ctmpl:ro
      - ./monitoring/consul/consul-template-stockfish.hcl:/etc/consul-template/consul-template.hcl:ro
    depends_on:
      - stockfish-1
      - stockfish-2
      - stockfish-3
      - consul
    networks:
      - chessnet

  postgres-master:
    image: postgres:15
    container_name: postgres-master
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      READONLY_USER: ${DB_READONLY_USER}
      READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    networks:
      - chessnet

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    entrypoint: ["/usr/local/bin/docker-entrypoint-replica.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
      REPLICATION_HOST: postgres-master
      REPLICATION_PORT: 5432
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/docker-entrypoint-replica.sh:/usr/local/bin/docker-entrypoint-replica.sh:ro
    depends_on:
      - postgres-master
    ports:
      - "5433:5432"
    networks:
      - chessnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chessnet

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
    networks:
      - chessnet

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - chessnet

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - chessnet

volumes:
  postgres-master-data:
  postgres-replica-data:
  grafana-data:
  loki-data:
  es-data:

networks:
  chessnet:
    driver: bridge
