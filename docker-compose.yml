services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
#    volumes:
#      - ./:/app
#    working_dir: /app
    environment:
      - ENGINE_HOST=stockfish
      - ENGINE_PORT=5555
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ES_HOST=${ES_HOST}
      - ES_PORT=${ES_PORT}
    depends_on:
      - postgres
#      - elasticsearch
      - redis
      - stockfish
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    networks:
      - chessnet

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - adminer
    networks:
      - chessnet

  adminer:
    image: adminer:4
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - chessnet

  stockfish:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: stockfish
    expose:
      - "5555"
    networks:
      - chessnet
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1g
    volumes:
      - ~/.m2:/root/.m2
      - ./testData:/app/testData
  postgres:
  postgres-master:
    image: postgres:15
    container_name: postgres-master
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      READONLY_USER: ${DB_READONLY_USER}
      READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    networks:
      - chessnet

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    entrypoint: ["/usr/local/bin/docker-entrypoint-replica.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
      REPLICATION_HOST: postgres-master
      REPLICATION_PORT: 5432
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/docker-entrypoint-replica.sh:/usr/local/bin/docker-entrypoint-replica.sh:ro
    depends_on:
      - postgres-master
    ports:
      - "5433:5432"
    networks:
      - chessnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chessnet

volumes:
  postgres-data:
  postgres-master-data:
  postgres-replica-data:
  es-data:

networks:
  chessnet:
    driver: bridge
