name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=unit -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-unit
          path: ci-reports

  integration:
    runs-on: ubuntu-latest
    needs: unit
    name: Integration Tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=integration -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-integration
          path: ci-reports

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    strategy:
      fail-fast: false
      matrix:
        stockfish_provider: [mock, real]
    name: E2E Tests (${{ matrix.stockfish_provider }})
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=e2e -e TEST_STOCKFISH_PROVIDER=${{ matrix.stockfish_provider }} -e E2E_TECH_USER_PASSWORD=${{ secrets.E2E_TECH_USER_PASSWORD }} -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-e2e-${{ matrix.stockfish_provider }}
          path: ci-reports

  report:
    runs-on: ubuntu-latest
    name: Allure Test Report
    needs:
      - unit
      - integration
      - e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - uses: actions/cache@v4
        with:
          path: ci-reports/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: ci-reports-*
          path: ci-reports
          merge-multiple: true
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=report -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -e GITHUB_SERVER_URL=${{ github.server_url }} -e GITHUB_REPOSITORY=${{ github.repository }} -e GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }} -e GITHUB_RUN_ID=${{ github.run_id }} -e GITHUB_RUN_NUMBER=${{ github.run_number }} -e GITHUB_SHA=${{ github.sha }} -e GITHUB_REF_NAME=${{ github.ref_name }} -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ci-reports/allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-report
          path: ci-reports

  deploy-pages:
    runs-on: ubuntu-latest
    needs: report
    name: Deploy report to GitHub Pages
    if: github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
