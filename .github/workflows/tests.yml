name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=unit -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-unit
          path: ci-reports

  integration:
    runs-on: ubuntu-latest
    needs: unit
    name: Integration Tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=integration -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-integration
          path: ci-reports

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    name: E2E Tests
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=e2e -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-e2e
          path: ci-reports

  report:
    runs-on: ubuntu-latest
    name: Allure Test Report
    needs:
      - unit
      - integration
      - e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: ci-reports-*
          path: ci-reports
          merge-multiple: true
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=report -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ci-reports/allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-report
          path: ci-reports

  deploy-pages:
    runs-on: ubuntu-latest
    needs: report
    name: Deploy report to GitHub Pages
    if: github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
