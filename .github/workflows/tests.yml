name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=unit -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-unit
          path: ci-reports

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=integration -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-integration
          path: ci-reports

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=e2e -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-e2e
          path: ci-reports

  report:
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: ci-reports-*
          path: ci-reports
          merge-multiple: true
      - run: docker build -f ci/test-runner.Dockerfile -t chessinsight-tests:${{ github.sha }} .
      - run: docker run --rm -e TEST_STAGE=report -e REPO_URL=https://github.com/${{ github.repository }} -e REPO_REF=${{ github.sha }} -e RESULTS_DIR=/reports -v ${{ github.workspace }}/ci-reports:/reports chessinsight-tests:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-report
          path: ci-reports
