name: observability-benchmark

on:
  workflow_dispatch:
    inputs:
      rps:
        description: "Target RPS"
        required: false
        default: "100"
      duration:
        description: "Load duration (e.g. 120s)"
        required: false
        default: "120s"
      warmup_duration:
        description: "Warmup duration (e.g. 30s)"
        required: false
        default: "30s"
      warmup_rps:
        description: "Warmup RPS"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  observability-benchmark:
    runs-on: ubuntu-latest
    name: Observability Benchmark
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-reports/observability
      - run: >
          ./ci/run-analysis-perf.sh
          --output-dir ci-reports/observability
          --ui-mode off
          --rps "${{ inputs.rps }}"
          --duration "${{ inputs.duration }}"
          --warmup-duration "${{ inputs.warmup_duration }}"
          --warmup-rps "${{ inputs.warmup_rps }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports-observability
          path: ci-reports/observability
