<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Статус</title>
    <link rel="stylesheet" href="/status/status.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="header">
        <div>
          <h1>Состояние сервера</h1>
          <p class="subtitle">Метрики Nginx</p>
        </div>
        <div class="timestamp" id="updatedAt">--</div>
      </header>

      <section class="grid">
        <div class="card">
          <h2>Соединения</h2>
          <div class="value" id="activeConnections">--</div>
          <div class="label">Активные</div>
          <div class="split">
            <div>
              <div class="mini" id="readingConnections">--</div>
              <div class="label">Чтение</div>
            </div>
            <div>
              <div class="mini" id="writingConnections">--</div>
              <div class="label">Запись</div>
            </div>
            <div>
              <div class="mini" id="waitingConnections">--</div>
              <div class="label">Ожидание</div>
            </div>
          </div>
          <div class="meter">
            <div class="bar bar-reading" id="barReading"></div>
            <div class="bar bar-writing" id="barWriting"></div>
            <div class="bar bar-waiting" id="barWaiting"></div>
          </div>
        </div>

        <div class="card">
          <h2>Запросы</h2>
          <div class="value" id="totalRequests">--</div>
          <div class="label">Всего</div>
          <div class="split">
            <div>
              <div class="mini" id="acceptedRequests">--</div>
              <div class="label">Принятые соединения</div>
            </div>
            <div>
              <div class="mini" id="handledRequests">--</div>
              <div class="label">Обработанные соединения</div>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <a href="/">На главную</a>
        <a href="/documentation">Документация</a>
      </footer>
    </main>
    <script src="/status/status.js"></script>
  </body>
</html>
